name: Genesis PRD gate

on:
  push:
    branches: [genesis/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-prd-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: paperclip
          POSTGRES_DB: paperclip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paperclip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:paperclip@127.0.0.1:5432/paperclip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee install.log
      - name: Report dependency-install diagnostics
        if: steps.install.outcome == 'failure'
        run: |
          {
            echo '### Dependency-install diagnostics'
            echo '```text'
            tail -n 120 install.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          diag=$(tail -n 20 install.log | tr '\n' ' ' | cut -c1-900)
          echo "::error title=Dependency install::$diag"
          exit 1
      - name: Restore workspace links
        run: pnpm run preflight:workspace-links
      - name: Apply migrations to clean PostgreSQL
        run: pnpm db:migrate
      - name: Verify runner, capability and protocol contracts
        id: runner-build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @paperclipai/paperclip-runner build 2>&1 | tee runner-build.log
      - name: Report runner-build diagnostics
        if: steps.runner-build.outcome == 'failure'
        run: |
          diag=$(tail -n 30 runner-build.log | tr '\n' ' ' | cut -c1-900)
          echo "::error title=Runner build::$diag"
          exit 1
      - name: Verify full workspace typecheck
        id: workspace-typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee workspace-typecheck.log
      - name: Report workspace-typecheck diagnostics
        if: steps.workspace-typecheck.outcome == 'failure'
        run: |
          diag=$(tail -n 30 workspace-typecheck.log | tr '\n' ' ' | cut -c1-900)
          echo "::error title=Workspace typecheck::$diag"
          exit 1
      - name: Verify full workspace tests
        run: pnpm test
      - name: Verify full workspace build
        run: pnpm build
