name: Genesis PRD gate

on:
  push:
    branches: [genesis/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-prd-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Full workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: paperclip
          POSTGRES_DB: paperclip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paperclip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:paperclip@127.0.0.1:5432/paperclip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to clean PostgreSQL
        run: pnpm db:migrate
      - name: Verify runner, capability and protocol contracts
        run: pnpm --filter @paperclipai/paperclip-runner build
      - name: Verify full workspace typecheck
        run: pnpm typecheck
      - name: Verify full workspace tests
        run: pnpm test
      - name: Verify full workspace build
        run: pnpm build
